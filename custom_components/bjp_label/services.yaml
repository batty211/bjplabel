print_label:
  name: Print customer label
  description: Parse Thai customer text, preview it, or print it through hass-niimbot. Preview calls can return an image data URL.
  fields:
    text:
      name: Customer text
      description: Paste the customer name, phone number, and address in any line order.
      required: false
      selector:
        text:
          multiline: true
    name:
      name: Customer name
      description: Customer name printed on line 1.
      required: false
      selector:
        text:
    phone:
      name: Phone number
      description: Phone number printed on line 2.
      required: false
      selector:
        text:
    address:
      name: Address
      description: Address printed on lines 3 and 4.
      required: false
      selector:
        text:
          multiline: true
    postal_code:
      name: Postal code
      description: Optional postal code for legacy structured service calls.
      required: false
      selector:
        text:
    note:
      name: Note
      description: Optional note for future persistence. It is not printed in label v1.
      required: false
      selector:
        text:
          multiline: true
    font:
      name: Thai font
      description: Thai-capable .ttf filename available to hass-niimbot.
      required: false
      default: NotoSansThai-Regular.ttf
      selector:
        text:
    width:
      name: Label width
      required: false
      default: 640
      selector:
        number:
          min: 10
          max: 1600
          mode: box
    height:
      name: Label height
      required: false
      default: 384
      selector:
        number:
          min: 10
          max: 1600
          mode: box
    density:
      name: Density
      required: false
      default: 3
      selector:
        number:
          min: 1
          max: 5
          mode: slider
    rotate:
      name: Rotation
      required: false
      default: 90
      selector:
        select:
          options:
            - "0"
            - "90"
            - "180"
            - "270"
    preview:
      name: Preview only
      description: Generate the label image without printing; request a service response to receive the image data URL.
      required: false
      default: false
      selector:
        boolean:
    device_id:
      name: Niimbot device id
      description: Optional override for the printer selected during BJP Label setup.
      required: false
      selector:
        text:

save_customer:
  name: Save customer
  description: Reserved for Phase 2 SQLite persistence.
  fields:
    name:
      required: true
      selector:
        text:
    phone:
      required: true
      selector:
        text:
    address:
      required: true
      selector:
        text:
          multiline: true
    note:
      required: false
      selector:
        text:
          multiline: true

search_customers:
  name: Search customers
  description: Reserved for Phase 2 customer search.
  fields:
    query:
      required: true
      selector:
        text:

print_customer:
  name: Print saved customer
  description: Reserved for Phase 2 reprint by saved customer id.
  target:
    device:
      integration: niimbot
  fields:
    customer_id:
      required: true
      selector:
        number:
          min: 1
          mode: box
